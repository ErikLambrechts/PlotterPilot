<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >
    <title>Plotbot CNC</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >
</head>

<body>
<div class="app">

    <header class="topbar">
        <div>
            <h1>{{ machine_name }}</h1>
            <div class="subtitle">
                CNC machine control
            </div>
        </div>

        <div class="connection">
            <span id="connectionDot" class="status-dot"></span>
            <span id="connectionText">Disconnected</span>
            <span id="hostText">plotbot.local</span>
        </div>
    </header>

    <main class="layout">

        <section class="workspace-card card">
            <div class="card-header">
                <div>
                    <h2>Workspace</h2>
                    <span id="workspaceSize"></span>
                </div>

                <div class="workspace-help">
                    Click to move
                </div>
            </div>

            <div class="workspace-container">
                <canvas id="workspace"></canvas>
            </div>
        </section>

        <aside class="side">

            <section class="card">
                <h2>Position</h2>

                <div class="position-grid">
                    <div class="position-value">
                        <span>X</span>
                        <strong id="posX">0.00</strong>
                        <small>mm</small>
                    </div>

                    <div class="position-value">
                        <span>Y</span>
                        <strong id="posY">0.00</strong>
                        <small>mm</small>
                    </div>

                    <div class="position-value">
                        <span>Z</span>
                        <strong id="posZ">0.00</strong>
                        <small>mm</small>
                    </div>
                </div>
            </section>

            <section class="card">
                <h2>Jog</h2>

                <label class="step-label">
                    Step
                    <select id="jogStep">
                        <option value="0.1">0.1 mm</option>
                        <option value="1" selected>1 mm</option>
                        <option value="10">10 mm</option>
                        <option value="50">50 mm</option>
                    </select>
                </label>

                <div class="jog-grid">
                    <div></div>
                    <button
                        class="jog-button"
                        data-axis="Y"
                        data-direction="1"
                    >Y+</button>
                    <div></div>

                    <button
                        class="jog-button"
                        data-axis="X"
                        data-direction="-1"
                    >X−</button>

                    <button
                        class="home-button"
                        id="homeXY"
                    >Home XY</button>

                    <button
                        class="jog-button"
                        data-axis="X"
                        data-direction="1"
                    >X+</button>

                    <div></div>
                    <button
                        class="jog-button"
                        data-axis="Y"
                        data-direction="-1"
                    >Y−</button>
                    <div></div>
                </div>

                <div class="z-controls">
                    <button
                        class="jog-button"
                        data-axis="Z"
                        data-direction="-1"
                    >Z−</button>

                    <button
                        class="jog-button"
                        data-axis="Z"
                        data-direction="1"
                    >Z+</button>
                </div>

                <p class="keyboard-help">
                    Keyboard: arrows = X/Y · PageUp/PageDown = Z
                    · Shift = 10× step
                </p>
            </section>

            <section class="card">
                <h2>Homing</h2>

                <div class="button-row">
                    <button id="homeX">Home X</button>
                    <button id="homeY">Home Y</button>
                </div>
            </section>

            <section class="card">
                <h2>Connection</h2>

                <div class="connection-info">
                    <div>
                        <span>Host</span>
                        <strong id="hostValue">plotbot.local</strong>
                    </div>

                    <div>
                        <span>Port</span>
                        <strong id="portValue">23</strong>
                    </div>
                </div>

                <div class="button-row">
                    <button
                        class="primary"
                        id="connectButton"
                    >Connect</button>

                    <button
                        class="danger"
                        id="disconnectButton"
                    >Disconnect</button>
                </div>

                <div
                    id="errorMessage"
                    class="error-message hidden"
                ></div>
            </section>

            <section class="card">
                <h2>Last command</h2>
                <code id="lastCommand">—</code>
            </section>

        </aside>
    </main>
</div>

<script
    src="{{ url_for('static', filename='app.js') }}"
></script>
</body>
</html>
